# Render Blueprint for Sarthi IAS Video Studio: PostgreSQL, the API web service and the job worker.
# Secrets marked "sync: false" are entered by the owner in the Render dashboard; nothing secret lives here.
# Plans and region are starting points; confirm them against the Render pricing page before applying.

databases:
  - name: sarthi-studio-db
    databaseName: sarthi_studio
    user: sarthi_studio
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []

envVarGroups:
  - name: sarthi-studio-shared
    envVars:
      - key: STUDIO_ENV
        value: production
      - key: STUDIO_SESSION_SECRET
        generateValue: true
      - key: STUDIO_STORAGE_BACKEND
        value: s3
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: STUDIO_MAX_FILE_BYTES
        value: "524288000"
      - key: STUDIO_SIGNED_URL_SECONDS
        value: "900"
      - key: STUDIO_JOB_LEASE_SECONDS
        value: "180"

services:
  - type: web
    name: sarthi-studio-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./saarthi_video_engine/deploy/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/live
    preDeployCommand: python -m app.cli migrate
    autoDeploy: false
    envVars:
      - fromGroup: sarthi-studio-shared
      - key: DATABASE_URL
        fromDatabase:
          name: sarthi-studio-db
          property: connectionString
      - key: STUDIO_CORS_ORIGINS
        sync: false

  - type: worker
    name: sarthi-studio-worker
    runtime: docker
    region: singapore
    plan: standard
    dockerfilePath: ./saarthi_video_engine/deploy/worker.Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker
    autoDeploy: false
    envVars:
      - fromGroup: sarthi-studio-shared
      - key: DATABASE_URL
        fromDatabase:
          name: sarthi-studio-db
          property: connectionString
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STUDIO_VISUAL_PROVIDER
        value: auto
